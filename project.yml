name: PianoPractice
options:
  bundleIdPrefix: jp.personal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PianoCore:
    path: Packages/PianoCore
targets:
  PianoPractice:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PianoCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ピアノ練習
        UILaunchScreen: {}
        UIAppFonts:
          - Bravura.otf
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: MusicXML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.musicxml.musicxml
              - com.recordare.musicxml.compressed
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.musicxml.musicxml
            UTTypeDescription: MusicXML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
              public.mime-type: [application/vnd.recordare.musicxml+xml]
          - UTTypeIdentifier: com.recordare.musicxml.compressed
            UTTypeDescription: 圧縮 MusicXML
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mxl]
              public.mime-type: [application/vnd.recordare.musicxml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.personal.PianoPractice
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
