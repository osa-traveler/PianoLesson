name: PianoPractice
options:
  bundleIdPrefix: jp.personal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PianoCore:
    path: Packages/PianoCore
targets:
  PianoPractice:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PianoCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ピアノ練習
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.personal.PianoPractice
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
